<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
</style>
</helmet>

<sc-if value="{{ isStacked }}" hint-placeholder-val="{{ true }}">
  <div style="height: 100%; display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; border: 1px solid #EEE7DA; overflow: hidden; box-shadow: 0 2px 6px -4px rgba(10,41,71,0.14)">
    <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
      <div style="aspect-ratio: 2 / 3; background: {{ posterBg }}; position: relative; display: flex; align-items: flex-end; padding: 9px">
        <span style="font-family: ui-monospace, monospace; font-size: 11px; color: rgba(255,255,255,0.92); background: rgba(10,41,71,0.55); padding: 2px 6px; border-radius: 5px">ポスター 2:3</span>
        <span style="position: absolute; top: 8px; right: 8px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; background: {{ scoreBg }}; color: {{ scoreFg }}; display: grid; place-items: center; font-size: 13px; font-weight: 700">{{ score }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ showTypePoster }}" hint-placeholder-val="{{ false }}">
      <div style="aspect-ratio: 2 / 3; background: {{ typeBg }}; border-bottom: 1px solid #EEE7DA; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 13px">
        <span style="font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6E4930">{{ year }}</span>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: {{ typeSize }}; line-height: 1.3; color: #0A2947; text-wrap: pretty">{{ title }}</span>
        <span style="font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em; color: #3D4B5A">{{ platform }}</span>
        <span style="position: absolute; top: 11px; right: 11px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; background: {{ scoreBg }}; color: {{ scoreFg }}; display: grid; place-items: center; font-size: 13px; font-weight: 700">{{ score }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
      <div style="flex: 1; min-height: 0; padding: 11px 12px; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: {{ bodyTitleSize }}; line-height: 1.4; color: #0A2947; text-wrap: pretty">{{ title }}</span>
        <span style="font-size: 11px; color: #6B7885">{{ meta }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ showTypePoster }}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; min-height: 0; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="font-size: 11px; color: #6B7885">{{ watchedLabel }}</span>
        <span class="ms" style="font-size: 15px; color: #6B7885" title="ポスター未登録">image_not_supported</span>
      </div>
    </sc-if>
  </div>
</sc-if>

<sc-if value="{{ isThumb }}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; gap: 11px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EEE7DA; box-shadow: 0 2px 6px -4px rgba(10,41,71,0.14)">
    <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
      <div style="flex: none; width: {{ thumbW }}; aspect-ratio: 2 / 3; border-radius: 8px; background: {{ posterBg }}"></div>
    </sc-if>
    <sc-if value="{{ showTypePoster }}" hint-placeholder-val="{{ false }}">
      <div style="flex: none; width: {{ thumbW }}; aspect-ratio: 2 / 3; border-radius: 8px; background: {{ typeBg }}; border: 1px solid #E8DFCC; display: flex; align-items: center; justify-content: center; padding: 4px">
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 15px; color: #A2703F">{{ initial }}</span>
      </div>
    </sc-if>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: {{ bodyTitleSize }}; line-height: 1.4; color: #0A2947; text-wrap: pretty">{{ title }}</span>
        <span style="flex: none; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; background: {{ scoreBg }}; color: {{ scoreFg }}; display: grid; place-items: center; font-size: 13px; font-weight: 700">{{ score }}</span>
      </div>
      <span style="font-size: 11px; color: #6B7885">{{ meta }}</span>
      <sc-if value="{{ showMood }}" hint-placeholder-val="{{ true }}">
        <span style="align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: #DCE4EC; font-size: 11px; color: #24435E; white-space: nowrap">{{ mood }}</span>
      </sc-if>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isBleed }}" hint-placeholder-val="{{ false }}">
  <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: {{ bleedBg }}; border: 1px solid {{ bleedBorder }}; display: flex; flex-direction: column; justify-content: flex-end">
    <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,20,34,0.92) 0%, rgba(6,20,34,0.55) 34%, rgba(6,20,34,0.05) 62%)"></div>
    </sc-if>
    <span style="position: absolute; top: 9px; right: 9px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; background: {{ bleedScoreBg }}; color: {{ bleedScoreFg }}; display: grid; place-items: center; font-size: 13px; font-weight: 700">{{ score }}</span>
    <div style="position: relative; padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: {{ bleedTitleSize }}; line-height: 1.35; color: {{ bleedFg }}; text-wrap: pretty">{{ title }}</span>
      <span style="font-size: 11px; color: {{ bleedSubFg }}">{{ meta }}</span>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:300},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stacked&quot;,&quot;thumb&quot;,&quot;bleed&quot;],&quot;default&quot;:&quot;stacked&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hasPoster&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;record&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  score(n) {
    if (n >= 5) return { scoreBg: "#96663A", scoreFg: "#FFFFFF" };
    if (n === 4) return { scoreBg: "#E7CDB4", scoreFg: "#6E4930" };
    return { scoreBg: "#F0EADC", scoreFg: "#3D4B5A" };
  }

  renderVals() {
    const r = this.props.record ?? {};
    const variant = this.props.variant ?? "stacked";
    const has = this.props.hasPoster ?? true;
    const compact = this.props.compact ?? false;
    const title = r.title ?? "タイトル";
    const s = this.score(r.score ?? 3);

    return Object.assign({
      isStacked: variant === "stacked",
      isThumb: variant === "thumb",
      isBleed: variant === "bleed",
      showImage: has,
      showTypePoster: !has,
      showMood: !compact && !!r.mood,
      title: title,
      year: r.year ?? "",
      platform: r.platform ?? "",
      mood: r.mood ?? "",
      score: r.score ?? 3,
      initial: title.slice(0, 1),
      meta: [r.year, r.platform, r.watchedShort].filter(Boolean).join(" · "),
      watchedLabel: r.watchedShort ? r.watchedShort + " に視聴" : "",
      posterBg: r.posterBg ?? "#24435E",
      typeBg: "#F7F0E3",
      typeSize: compact ? (title.length > 12 ? "13px" : "16px") : (title.length > 12 ? "17px" : "21px"),
      bodyTitleSize: compact ? "12px" : "14px",
      thumbW: compact ? "44px" : "62px",
      bleedBg: has ? (r.posterBg ?? "#24435E") : "#F7F0E3",
      bleedBorder: has ? "transparent" : "#E8DFCC",
      bleedFg: has ? "#FFFFFF" : "#0A2947",
      bleedSubFg: has ? "rgba(255,255,255,0.78)" : "#6B7885",
      bleedTitleSize: compact ? "14px" : "17px",
      bleedScoreBg: has ? "rgba(255,248,236,0.94)" : s.scoreBg,
      bleedScoreFg: has ? "#6E4930" : s.scoreFg
    }, s);
  }
}
</script>
</body>
</html>
